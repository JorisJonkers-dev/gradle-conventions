# Publishes the convention plugin modules and aggregate to GitHub Packages when
# a vX.Y.Z tag is pushed. Independent of release-please (whose GITHUB_TOKEN PR
# flow is blocked by the org "Actions may create PRs" setting); a maintainer
# pushes the tag and this publishes that exact version.
name: Publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The wrapper downloads Gradle from the packages proxy, which needs the proxy token.
      - uses: JorisJonkers-dev/github-workflows/actions/setup-java-gradle@658bec7f448631fbaa3f28d3a2e5708390e0c4c1 # v0.51.0
        with:
          java-version: '21.0.13+9.0.LTS'
          packages-proxy-token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: true
      - name: Publish missing Gradle packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-missing-github-packages.sh
